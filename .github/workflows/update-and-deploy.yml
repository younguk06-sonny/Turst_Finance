name: 데이터 갱신 및 배포

on:
  # 매주 월요일 06:07(KST) 확인. cron은 UTC 기준 → 일요일 21:07 UTC.
  # 새 분기 데이터가 FISIS에 올라오는 날짜가 일정하지 않아 매주 확인하고,
  # 실제로 바뀐 경우에만 커밋합니다.
  schedule:
    - cron: '7 21 * * 0'
  # Actions 탭의 [Run workflow] 버튼으로 수동 실행
  workflow_dispatch:
  # 화면(index.html 등)을 고쳐 main에 올리면 바로 다시 배포
  push:
    branches: [main]

permissions:
  contents: write   # 데이터 파일 커밋
  pages: write      # GitHub Pages 배포
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # 코드 push 때는 데이터 수집을 건너뛰고 배포만 합니다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FISIS 수집 (표준 라이브러리만 사용)
        env:
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
        run: |
          if [ -z "$FISIS_API_KEY" ]; then
            echo "::warning::FISIS_API_KEY 시크릿이 없어 수집을 건너뜁니다. 기존 데이터로 배포합니다."
            exit 0
          fi
          python scripts/fetch_fisis.py

      - name: 변경 시에만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fisis_data.json
          if git diff --staged --quiet; then
            echo "변경 없음" >> "$GITHUB_STEP_SUMMARY"
          else
            Q=$(python -c "import json;print(json.load(open('data/fisis_data.json'))['meta']['latest'])")
            git commit -m "data: FISIS ${Q} 기준 갱신"
            git push
            echo "**${Q} 기준으로 갱신**" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: update
    # update가 성공했거나(스케줄·수동) 건너뛰어졌을 때(push) 배포.
    # Cloudflare Pages만 쓸 경우 저장소 변수 DEPLOY_TARGET=cloudflare 로 이 단계를 끕니다.
    if: >-
      always() && vars.DEPLOY_TARGET != 'cloudflare' &&
      (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 방금 커밋된 데이터까지 포함
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
